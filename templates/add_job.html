{% extends "base.html" %}
{% block title %>Add Job - RecruitPro{% endblock %}
{% block content %}

<div class="page-header">
    <h2>Add New Job</h2>
    <p>Create a new job posting for recruitment.</p>
</div>

<form method="POST" action="{{ url_for('add_job') }}">
    <div class="row g-3">
        <div class="col-12"><label class="form-label">Job Title <span class="text-danger">*</span></label><input type="text" name="title" class="form-control" required></div>
        <div class="col-md-6"><label class="form-label">Department</label><input type="text" name="department" class="form-control"></div>
        <div class="col-md-6"><label class="form-label">Location</label><input type="text" name="location" class="form-control"></div>
        <div class="col-md-6"><label class="form-label">Openings</label><input type="number" name="openings" class="form-control" min="1" value="1"></div>
        <div class="col-md-6"><label class="form-label">Experience Required</label><input type="text" name="experience_required" class="form-control" placeholder="e.g. 3 years"></div>
        <div class="col-12"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="3"></textarea></div>
        <div class="col-12">
            <label class="form-label">Status</label>
            <select name="status" class="form-select">
                <option value="Open">Open</option>
                <option value="Closed">Closed</option>
            </select>
        </div>
    </div>
    <div class="mt-3">
        <button type="submit" class="btn btn-primary-custom"><i class="bi bi-person-plus-fill me-2"></i> Create Job</button>
        <a href="{{ url_for('jobs') }}" class="btn btn-secondary">Cancel</a>
    </div>
</form>

{% endblock %}
