<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - RecruitPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <style>
        .auth-body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary-navy) 0%, #1e3a8a 55%, #2563EB 100%);
            padding: 24px;
        }
        .auth-card {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            padding: 36px 32px;
        }
        .auth-logo {
            width: 52px; height: 52px;
            background: var(--primary-blue);
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; font-weight: 700; color: #fff;
            margin: 0 auto 14px;
        }
        .auth-title { font-size: 22px; font-weight: 700; color: var(--text); text-align: center; }
        .auth-sub { color: var(--text-secondary); text-align: center; font-size: 13px; margin-bottom: 26px; }
        .auth-label { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
        .auth-input { border-radius: 10px; padding: 11px 14px; border: 1px solid var(--border); }
        .auth-input:focus { border-color: var(--primary-blue); box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
        .auth-btn {
            width: 100%; padding: 12px; border-radius: 10px;
            background: var(--primary-blue); color: #fff; font-weight: 600; border: none;
            transition: background 0.2s;
        }
        .auth-btn:hover { background: var(--primary-hover); color: #fff; }
        .auth-alt { text-align: center; margin-top: 18px; font-size: 13px; color: var(--text-secondary); }
        .auth-alt a { color: var(--primary-blue); font-weight: 600; }
        .theme-float {
            position: fixed; top: 20px; right: 20px;
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(255,255,255,0.15); color: #fff; border: none;
            display: flex; align-items: center; justify-content: center; font-size: 17px;
            backdrop-filter: blur(4px); cursor: pointer; z-index: 10;
        }
    </style>
</head>
<body class="auth-body">
    <button id="darkModeToggle" class="theme-float" title="Toggle Dark Mode"><i class="bi bi-moon-fill"></i></button>

    <div class="auth-card">
        <div class="auth-logo">RP</div>
        <div class="auth-title">Create Your Account</div>
        <div class="auth-sub">Join RecruitPro recruitment portal</div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ 'success' if category == 'success' else 'danger' if category == 'danger' else 'warning' if category == 'warning' else 'info' }} py-2 small mb-3">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}">
            <div class="mb-3">
                <label class="auth-label">Full Name</label>
                <input type="text" name="name" class="form-control auth-input" placeholder="e.g. Rahul Sharma" required autofocus>
            </div>
            <div class="mb-3">
                <label class="auth-label">Email Address</label>
                <input type="email" name="email" class="form-control auth-input" placeholder="you@recruitpro.com" required>
            </div>
            <div class="mb-3">
                <label class="auth-label">Password</label>
                <input type="password" name="password" class="form-control auth-input" placeholder="Minimum 6 characters" required>
            </div>
            <div class="mb-3">
                <label class="auth-label">Confirm Password</label>
                <input type="password" name="confirm" class="form-control auth-input" placeholder="Re-enter your password" required>
            </div>
            <div class="mb-4">
                <label class="auth-label">I want to join as</label>
                <select name="role" class="form-select auth-input">
                    <option value="Recruiter">Recruiter (post jobs, manage hiring)</option>
                    <option value="Candidate">Candidate (apply for jobs, practice coding)</option>
                </select>
            </div>
            <button type="submit" class="btn auth-btn"><i class="bi bi-person-plus-fill me-2"></i>Create Account</button>
        </form>

        <div class="auth-alt">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            (function () {
                var html = document.documentElement;
                var toggle = document.getElementById('darkModeToggle');
                function setTheme(theme) {
                    html.setAttribute('data-bs-theme', theme);
                    localStorage.setItem('recruitpro-theme', theme);
                    if (toggle) toggle.innerHTML = theme === 'dark' ? '<i class="bi bi-sun-fill"></i>' : '<i class="bi bi-moon-fill"></i>';
                }
                setTheme(localStorage.getItem('recruitpro-theme') || 'light');
                if (toggle) toggle.addEventListener('click', function () {
                    setTheme(html.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark');
                });
            })();
        </script>
    </div>
</body>
</html>
