{% extends "base.html" %}

{% block title %}Server Error - RecruitPro{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="display-1 fw-bold text-danger">500</div>
    <h2 class="mt-3">Something went wrong</h2>
    <p class="text-secondary">We hit an internal error while processing your request. Please try again.</p>
    <a href="{{ url_for('dashboard') if current_user.is_authenticated else url_for('login') }}" class="btn btn-primary mt-3">Retry</a>
</div>
{% endblock %}
