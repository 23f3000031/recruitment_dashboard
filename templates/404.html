{% extends "base.html" %}

{% block title %}Page Not Found - RecruitPro{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="display-1 fw-bold text-primary">404</div>
    <h2 class="mt-3">Page not found</h2>
    <p class="text-secondary">The page you requested does not exist or has been moved.</p>
    <a href="{{ url_for('dashboard') if current_user.is_authenticated else url_for('login') }}" class="btn btn-primary mt-3">Go back</a>
</div>
{% endblock %}
