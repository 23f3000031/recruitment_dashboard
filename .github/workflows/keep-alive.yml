name: keep-alive

# Render's free web service spins down after 15 minutes without traffic.
# Pinging it every 5 minutes keeps the instance warm so the shared link
# opens instantly instead of waiting ~50s for a cold start.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the live app
        run: |
          URL="https://recruitment-dashboard-rnlw.onrender.com/login"
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 -L "$URL" || true)
            echo "attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "Service did not answer with 200, but keeping the job green."
          exit 0
