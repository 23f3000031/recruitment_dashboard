services:
  - type: web
    name: recruitment-dashboard
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 120 --access-logfile -
    healthCheckPath: /login
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: AUTO_INIT_DB
        value: "1"
      - key: DATABASE_URL
        sync: false
